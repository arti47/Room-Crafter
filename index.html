<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f4efe4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15161a" media="(prefers-color-scheme: dark)">
<meta name="description" content="A room oracle for The Room Crafter: generate a room from keywords, then find out what searching it turns up.">
<title>Room Crafter</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<a class="skip-link" href="#screen">Skip to content</a>

<header class="app-header">
  <span class="brand">Room Crafter</span>
  <button id="theme-toggle" class="icon-btn" type="button" aria-label="Switch theme">◐</button>
</header>

<div id="room-header-host"></div>

<main id="screen" tabindex="-1"></main>

<div id="action-bar-host"></div>
<nav id="tabbar" class="tabbar" aria-label="Main"></nav>
<div id="toast-host" class="toast-host" aria-live="polite"></div>

<script type="module" src="./src/main.js"></script>
<script type="module">
  import { get, set } from "./src/settings.js";
  const order = ["system", "light", "dark"];
  document.getElementById("theme-toggle").addEventListener("click", () => {
    const next = order[(order.indexOf(get("theme")) + 1) % order.length];
    set("theme", next);
    document.getElementById("theme-toggle").setAttribute("aria-label", "Theme: " + next);
  });
</script>
</body>
</html>
