<header class="app-header">
  <span class="brand"><svg class="brand-mark" aria-hidden="true"><use href="#i-mark"/></svg>Room Crafter</span>
  <button id="theme-toggle" class="icon-btn" type="button" aria-label="Switch theme"><svg class="ico" aria-hidden="true"><use href="#i-theme"/></svg></button>
</header>

<div id="room-header-host"></div>

<main id="screen" tabindex="-1"></main>

<div id="action-bar-host"></div>
<nav id="tabbar" class="tabbar" aria-label="Main"></nav>
<div id="toast-host" class="toast-host" aria-live="polite"></div>

<script type="module" src="./src/main.js"></script>
<script type="module">
  import { get, set } from "./src/settings.js";
  const order = ["system", "light", "dark"];
  document.getElementById("theme-toggle").addEventListener("click", () => {
    const next = order[(order.indexOf(get("theme")) + 1) % order.length];
    set("theme", next);
  });
</script>
</body>
</html>
